name: Airspection CI

on:
  push:
    branches:
      - airspection/develop
      - airspection/release-v1.15.4
  pull_request:
    branches:
      - airspection/release-v1.15.4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-checks:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: px4io/px4-dev-nuttx-focal:2022-08-12
      options: --privileged --ulimit core=-1 --security-opt seccomp=unconfined
    strategy:
      fail-fast: false
      matrix:
        target:
          - check_format
          - shellcheck_all
          - validate_module_configs
          - parameters_metadata
          - airframe_metadata
          - module_documentation
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure Git ownership
        run: git config --system --add safe.directory '*'

      - name: Check environment
        run: |
          export
          ulimit -a

      - name: make ${{ matrix.target }}
        run: make ${{ matrix.target }}

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure Git ownership
        run: git config --system --add safe.directory '*'

      - name: Run clang-tidy in PX4 clang container
        run: |
          docker run --rm --privileged \
            --ulimit core=-1 \
            --security-opt seccomp=unconfined \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" \
            px4io/px4-dev-clang:2021-09-08 \
            make clang-tidy-quiet

  python-checks:
    name: python-mypy-flake8
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python check tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install mypy types-requests flake8

      - name: Run Python type and style checks
        run: |
          mypy --strict test/mavsdk_tests/*.py
          flake8 test/mavsdk_tests/*.py

  unit-tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    container:
      image: px4io/px4-dev-nuttx-focal:2022-08-12
      options: --privileged --ulimit core=-1 --security-opt seccomp=unconfined
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: unit-tests
            command: make tests
          - name: unit-tests-coverage
            command: make tests_coverage
          - name: ekf-unit-tests
            command: make tests TESTFILTER=EKF
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure Git ownership
        run: git config --system --add safe.directory '*'

      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}

  firmware-build:
    name: Cube Orange Plus firmware
    runs-on: ubuntu-latest
    timeout-minutes: 75
    container:
      image: px4io/px4-dev-nuttx-focal:2022-08-12
      options: --privileged --ulimit core=-1 --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure Git ownership
        run: git config --system --add safe.directory '*'

      - name: Build CubePilot Orange Plus
        run: make cubepilot_cubeorangeplus_default

  sitl-build:
    name: PX4 SITL build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: px4io/px4-dev-nuttx-focal:2022-08-12
      options: --privileged --ulimit core=-1 --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure Git ownership
        run: git config --system --add safe.directory '*'

      - name: Build PX4 SITL
        run: make px4_sitl_default

  standard-vtol-mavsdk:
    name: Standard VTOL SITL/MAVSDK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: px4io/px4-dev-simulation-focal:2021-09-08
      options: --privileged --ulimit core=-1 --security-opt seccomp=unconfined
    env:
      PX4_CMAKE_BUILD_TYPE: RelWithDebInfo
      PX4_HOME_LAT: 47.397742
      PX4_HOME_LON: 8.545594
      PX4_HOME_ALT: 488
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure Git ownership
        run: git config --system --add safe.directory '*'

      - name: Install MAVSDK
        run: |
          MAVSDK_VERSION="$(cat test/mavsdk_tests/MAVSDK_VERSION)"
          wget -q -nc "https://github.com/mavlink/MAVSDK/releases/download/v${MAVSDK_VERSION}/libmavsdk-dev_${MAVSDK_VERSION}_ubuntu20.04_amd64.deb"
          dpkg -i "libmavsdk-dev_${MAVSDK_VERSION}_ubuntu20.04_amd64.deb"

      - name: Build SITL and standard VTOL MAVSDK tests
        run: |
          rm -rf build/px4_sitl_default
          make px4_sitl_default
          make px4_sitl_default sitl_gazebo-classic
          DONT_RUN=1 make px4_sitl_default sitl_gazebo-classic mavsdk_tests

      - name: Run standard VTOL MAVSDK suite
        run: |
          cases=(
            "Takeoff and Land"
            "Fly VTOL mission"
            "RTL direct Home"
            "RTL direct Mission Land"
            "RTL with Mission Landing"
            "RTL with Reverse Mission"
            "Fly VTOL mission with wind change (ramped_up_wind.world)"
            "Fly VTOL Loiter with airspeed failure"
          )

          for case in "${cases[@]}"; do
            echo "Running standard_vtol MAVSDK case: ${case}"
            test/mavsdk_tests/mavsdk_test_runner.py \
              --speed-factor 10 \
              --abort-early \
              --model standard_vtol \
              --case "${case}" \
              test/mavsdk_tests/configs/sitl.json \
              --verbose
          done

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: standard-vtol-mavsdk-logs
          path: logs
          if-no-files-found: ignore
